<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aegis — privacy-first file manager</title>
<style>
/* self-hosted fonts: zero network needed, works fully offline */
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(fonts/inter-400.woff2) format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:swap;src:url(fonts/inter-500.woff2) format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-600.woff2) format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:700;font-display:swap;src:url(fonts/inter-700.woff2) format("woff2")}
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/space-grotesk-500.woff2) format("woff2")}
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/space-grotesk-600.woff2) format("woff2")}
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/space-grotesk-700.woff2) format("woff2")}
:root{--bg:#0a0a1b;--line:rgba(255,255,255,.09);--txt:#fff;--dim:rgba(255,255,255,.5);
--faint:rgba(255,255,255,.35);--acc:#7c6cff;--mint:#3ddc97;--peach:#ffb86b;--red:#ff6b7a}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5;
background:radial-gradient(900px 500px at 10% -5%,rgba(124,108,255,.35),transparent 60%),
radial-gradient(800px 500px at 90% 10%,rgba(61,220,151,.20),transparent 60%),
radial-gradient(700px 600px at 50% 110%,rgba(255,184,107,.13),transparent 60%),#0a0a1b}
h1,h2,.disp{font-family:"Space Grotesk",Inter,sans-serif}
#top{position:sticky;top:0;z-index:40;border-bottom:1px solid var(--line);
background:rgba(10,10,27,.75);backdrop-filter:blur(16px);padding:10px 18px}
#toprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700;
font-size:19px;color:#0a0a1b;background:linear-gradient(135deg,#a99bff,#7c6cff 50%,#3ddc97 130%);box-shadow:0 0 30px -6px rgba(124,108,255,.7)}
.brand b{font-family:"Space Grotesk";font-size:17px}.brand span{display:block;font-size:11px;color:var(--dim)}
nav{display:flex;gap:2px;margin:0 auto;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--dim);padding:8px 12px;border-radius:10px;font-size:13px;cursor:pointer}
nav button:hover{color:#fff;background:rgba(255,255,255,.06)}
nav button.on{color:#fff;background:rgba(255,255,255,.09)}
input,select,button,textarea{font:inherit;color:var(--txt)}
input,select,textarea{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:7px 11px}
input:focus{outline:none;border-color:rgba(124,108,255,.7)}
button{cursor:pointer}
.btn-pri{background:linear-gradient(135deg,#a99bff,#7c6cff 45%,#3ddc97 130%);border:0;color:#0a0a1b;
font-weight:700;border-radius:11px;padding:8px 16px}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:11px;padding:8px 14px}
button.danger{border:1px solid rgba(255,107,122,.5);color:var(--red);background:none;border-radius:11px;padding:8px 14px}
button:disabled{opacity:.45}
.badge{font-size:11px;font-weight:700;background:rgba(255,255,255,.07);padding:4px 10px;border-radius:99px;color:var(--dim);white-space:nowrap}
.badge.ok{background:rgba(61,220,151,.15);color:var(--mint)}
.badge.warn{background:rgba(255,184,107,.15);color:var(--peach)}
#quickrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px}
#quickrow button{font-size:12px;padding:5px 10px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:99px;color:var(--dim)}
#quickrow button:hover{color:#fff}
#prog{font-size:12px;color:var(--dim)}
#main{max-width:1180px;margin:0 auto;padding:20px 18px 90px}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;backdrop-filter:blur(14px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.stat{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);
border-radius:18px;padding:16px 18px}
.stat b{font-family:"Space Grotesk";font-size:30px;display:block;line-height:1.1}
.stat span{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--dim)}
.stat small{display:block;font-size:11px;color:var(--faint);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:850px){.grid2{grid-template-columns:1fr}nav{order:3;width:100%}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dim{color:var(--dim)}.small{font-size:12px}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tier{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.tier.Public{background:rgba(61,220,151,.15);color:var(--mint)}
.tier.Internal{background:rgba(255,184,107,.18);color:var(--peach)}
.tier.Sensitive{background:rgba(255,107,122,.16);color:var(--red)}
.ptag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(255,107,122,.16);color:#ff9aa4;white-space:nowrap}
.bar{height:9px;background:rgba(255,255,255,.08);border-radius:99px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c6cff,#a99bff);border-radius:99px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--dim);margin-top:10px}
.legend i{width:9px;height:9px;border-radius:99px;display:inline-block;margin-right:4px}
.frow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.05);
border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:13px}
.frow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .s{font-size:12px;color:var(--dim);white-space:nowrap;font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;background:rgba(0,0,0,.4);border:1px solid var(--line);
border-radius:10px;padding:10px;font-size:12px;max-height:300px;overflow:auto}
mark.pii{background:rgba(255,107,122,.35);color:#ffdfe3;border-radius:4px;padding:0 3px}
.tok{background:#5a0f16;color:#ff9aa4;border:1px solid #8a1f2a;border-radius:4px;
padding:0 5px;font-family:monospace;font-size:12px;white-space:nowrap}
.tree{font-size:13px}.tree div{padding:3px 0;cursor:pointer;color:var(--dim)}.tree div:hover{color:#fff}
.crumbs{font-size:13px;margin:8px 0 0}.crumbs a{color:var(--txt)}
a{color:#b9b2ff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:90}
.modal>div{background:#141428;border:1px solid var(--line);border-radius:14px;padding:20px;width:min(480px,92vw)}
.modal label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px}
.modal input,.modal select{width:100%}
#toasts{position:fixed;bottom:16px;left:16px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:#141428;border:1px solid var(--acc);border-radius:10px;padding:9px 14px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
/* agent widget */
#awbtn{position:fixed;right:22px;bottom:22px;z-index:80;width:58px;height:58px;border-radius:18px;border:0;
background:linear-gradient(135deg,#a99bff,#7c6cff 50%,#3ddc97 130%);box-shadow:0 0 34px -6px rgba(124,108,255,.8);
display:grid;place-items:center;cursor:pointer}
#awpanel{position:fixed;right:22px;bottom:92px;z-index:80;width:min(384px,calc(100vw - 44px));height:490px;
display:flex;flex-direction:column;overflow:hidden;border-radius:18px;opacity:0;visibility:hidden;
transform:scale(.96) translateY(10px);transform-origin:bottom right;pointer-events:none;
transition:opacity .2s ease,transform .2s ease,visibility .2s;
background:linear-gradient(180deg,rgba(30,30,60,.97),rgba(16,16,36,.98));border:1px solid var(--line);
box-shadow:0 24px 70px rgba(0,0,0,.6)}
#awpanel.open{opacity:1;visibility:visible;transform:none;pointer-events:auto}
#awlog{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:88%;border-radius:14px;padding:9px 13px;font-size:13px;line-height:1.55;white-space:pre-line}
.msg.u{align-self:flex-end;background:linear-gradient(135deg,#7c6cff,#5a4fe0);color:#fff}
.msg.a{align-self:flex-start;background:rgba(255,255,255,.07)}
#awchips{display:flex;gap:6px;overflow:auto;padding:0 12px 8px}
#awchips button{flex-shrink:0;font-size:11px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--dim)}
#awform{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
#awform input{flex:1}
/* ---------- polish: motion, hover, focus ---------- */
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:99px}::-webkit-scrollbar-track{background:transparent}
::selection{background:rgba(124,108,255,.5)}
#main>*{animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.glass,.stat{transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.glass:hover{border-color:rgba(255,255,255,.16)}
.stat:hover{transform:translateY(-2px);border-color:rgba(124,108,255,.45);box-shadow:0 12px 34px -12px rgba(124,108,255,.5)}
.stat b{font-variant-numeric:tabular-nums}
nav button{transition:all .15s ease}nav button:hover{transform:translateY(-1px)}
.btn-pri,.btn-ghost,.danger{transition:transform .12s ease,filter .15s ease,border-color .15s ease,background .15s ease}
.btn-pri:hover{transform:translateY(-1px);filter:brightness(1.07)}
.btn-pri:active,.btn-ghost:active{transform:scale(.97)}
.btn-ghost:hover{border-color:rgba(124,108,255,.6);background:rgba(124,108,255,.12)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #a99bff;outline-offset:2px}
input:focus{box-shadow:0 0 0 3px rgba(124,108,255,.22)}
table tr{transition:background .12s ease}table tbody tr:hover,table tr:hover{background:rgba(255,255,255,.035)}
.frow{transition:transform .14s ease,border-color .14s ease}
.frow:hover{transform:translateX(3px);border-color:rgba(255,255,255,.15)}
.tree div{transition:all .12s ease;border-radius:6px;padding:3px 6px;margin-left:-6px}
.tree div:hover{background:rgba(255,255,255,.06);transform:translateX(2px)}
#quickrow button{transition:all .14s ease}#quickrow button:hover{transform:translateY(-1px);color:#fff;border-color:rgba(124,108,255,.5)}
.tilebtn{display:block;width:100%;text-align:left;margin-bottom:8px;background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px 14px;transition:all .15s ease}
.tilebtn:hover{transform:translateY(-1px);border-color:rgba(124,108,255,.5);background:rgba(124,108,255,.08)}
.bar i{transition:width .8s cubic-bezier(.2,.7,.2,1)}
svg.donut{animation:pop .5s ease;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.skel{border-radius:12px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.11),rgba(255,255,255,.05));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.toast{animation:tin .22s ease}@keyframes tin{from{opacity:0;transform:translateX(-12px)}}
.tdots span{width:6px;height:6px;border-radius:99px;background:var(--dim);display:inline-block;margin-right:3px;animation:bl 1s infinite}
.tdots span:nth-child(2){animation-delay:.15s}.tdots span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* clean file views */
html{scroll-behavior:smooth}
#main{min-height:60vh}
.ghead{font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--dim);text-transform:uppercase;margin:14px 0 6px}
.frow{background:rgba(255,255,255,.05)}
.frow .s{font-variant-numeric:tabular-nums}
.xrow{cursor:pointer}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#0a0a1b;border-radius:99px;display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
select{cursor:pointer}
/* sleek charts */
.donut-wrap{filter:drop-shadow(0 10px 28px rgba(124,108,255,.22))}
svg.donut circle.seg{transition:opacity .18s ease,stroke-width .18s ease;cursor:pointer}
svg.donut circle.seg:hover{stroke-width:29}
.lpill{cursor:default;transition:background .14s ease;padding:3px 9px;border-radius:99px}
.lpill:hover{background:rgba(255,255,255,.1);color:#fff}
.brow{padding:8px 10px;border-radius:12px;transition:background .14s ease,transform .14s ease}
.brow:hover{background:rgba(255,255,255,.045);transform:translateX(2px)}
.rank{width:22px;height:22px;border-radius:8px;background:rgba(124,108,255,.18);color:#c9c2ff;
font-size:11px;font-weight:700;display:inline-grid;place-items:center;flex-shrink:0}
.brow:first-child .rank{background:linear-gradient(135deg,#a99bff,#3ddc97);color:#0a0a1b}
.bar{box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.bar i{box-shadow:0 0 12px rgba(124,108,255,.55)}
</style>
</head>
<body>
<div id="top">
  <div id="toprow">
    <span class="logo">V</span>
    <span class="brand"><b>Aegis</b><span>private files, understood.</span></span>
    <nav id="nav">
      <button data-t="dashboard" class="on" onclick="tab('dashboard',this)">Dashboard</button>
      <button data-t="search" onclick="tab('search',this)">Search</button>
      <button data-t="explorer" onclick="tab('explorer',this)">Explorer</button>
      <button data-t="storage" onclick="tab('storage',this)">Storage</button>
      <button data-t="organize" onclick="tab('organize',this)">Organize</button>
      <button data-t="ledger" onclick="tab('ledger',this)">Ledger</button>
    </nav>
    <span class="badge" id="vaultbadge">○ no scan</span>
    <label class="small dim"><input type="checkbox" id="power" onchange="state.power=this.checked;lsCur()"> Power</label>
    <label class="small dim"><input type="checkbox" id="offline" onchange="setOffline(this.checked)"> Offline</label>
    <button class="btn-ghost" onclick="openSettings()">Settings</button>
  </div>
  <div id="quickrow">
    <input id="scanpaths" size="34" placeholder="Scan path(s), comma separated — blank = home">
    <button class="btn-pri" id="scanbtn" onclick="startScan()">Scan</button>
    <button id="cancel" class="btn-ghost" style="display:none" onclick="stopScan()">Cancel</button>
    <span id="prog"></span>
    <span id="quick" class="row" style="gap:6px"></span>
    <input id="topq" size="20" placeholder="Search files…  ( / )" onkeydown="if(event.key==='Enter')topSearch()">
  </div>
</div>
<div id="main"></div>
<div class="modal" id="settings"><div>
  <h3 style="margin:0">Settings <span class="dim small">(key stays in server RAM only)</span></h3>
  <label>Provider</label>
  <select id="s_provider"><option>local-rules</option><option>anthropic</option><option>openai</option><option>ollama</option></select>
  <label>API key (blank = keep, never shown back)</label><input id="s_key" type="password" placeholder="sk-...">
  <label>Model</label><input id="s_model" placeholder="e.g. claude-sonnet-4-20250514 / gpt-4o-mini">
  <label>Base URL (OpenAI-compatible)</label><input id="s_base" placeholder="https://api.openai.com/v1">
  <label>Ollama URL / model</label>
  <div class="row"><input id="s_ollama" style="flex:1" placeholder="http://127.0.0.1:11434"><input id="s_omodel" style="flex:1" placeholder="llama3.1"></div>
  <div class="row" style="margin-top:12px"><button class="btn-pri" onclick="saveSettings()">Save</button>
  <button class="btn-ghost" onclick="clearKey()">Forget key</button><button class="btn-ghost" onclick="closeSettings()">Close</button></div>
  <p class="small dim" id="s_status"></p>
</div></div>
<div id="toasts"></div>
<button id="awbtn" onclick="awToggle()" title="Ask the vault agent"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0a0a1b" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="9" width="14" height="10" rx="3"/><circle cx="9.5" cy="14" r="1.2" fill="#0a0a1b"/><circle cx="14.5" cy="14" r="1.2" fill="#0a0a1b"/><path d="M12 9V5M9 5h6"/></svg></button>
<div id="awpanel">
  <div class="row" style="padding:12px 14px;border-bottom:1px solid var(--line);justify-content:space-between">
    <div class="row"><span class="logo" style="width:30px;height:30px;font-size:15px;border-radius:9px">V</span>
    <div><div style="font-weight:700">Vault Agent</div><div class="small" style="color:var(--mint)">● online · reads your index</div></div></div>
    <button class="btn-ghost" style="padding:5px 10px" onclick="awToggle()">✕</button>
  </div>
  <div id="awlog"></div>
  <div id="awchips"></div>
  <form id="awform" onsubmit="awSubmit(event)"><input id="awin" placeholder="Ask or command…" autocomplete="off" onkeydown="if(event.key==='Escape')awToggle()"><button class="btn-pri">➤</button></form>
</div>

<script>
const state={power:false,tab:'dashboard',treePath:'',lsPath:'',plan:null,sel:new Set(),clean:true,sort:'name'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qesc=s=>String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const fmt=n=>n>=1073741824?(n/1073741824).toFixed(1)+' GB':n>=1048576?(n/1048576).toFixed(1)+' MB':n>=1024?(n/1024).toFixed(0)+' KB':(n||0)+' B';
const dt=t=>t?new Date(t*1000).toLocaleString():'—';
const PAL=['#7c6cff','#3ddc97','#ffb86b','#38bdf8','#f472b6','#a3e635','#facc15','#94a3b8'];
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return r.json();}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),2800);}
function lsGet(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function tab(t,el){try{state.tab=t;document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('on'));
const b=el||document.querySelector(`[data-t=${t}]`);if(b)b.classList.add('on');
({dashboard:vDashboard,search:vSearch,explorer:vExplorer,storage:vStorage,organize:vOrganize,ledger:vLedger})[t]();}
catch(e){toast('tab failed: '+e.message);}}
function dead(msg){document.getElementById('main').innerHTML=`<div class="glass" style="text-align:center;padding:44px">
<div style="font-size:42px">◈</div><h2>Backend not reachable</h2>
<p class="dim">${esc(msg)}<br>Start it with <kbd>python app.py</kbd> in the <kbd>aegis</kbd> folder, then retry.</p>
<button class="btn-pri" onclick="boot()">Retry</button></div>`;}

/* ---------- scan / quick ---------- */
async function startScan(){const v=document.getElementById('scanpaths').value;
const rec=lsGet('aegis-recent',[]);if(v.trim()&&!rec.includes(v.trim()))lsSet('aegis-recent',[v.trim(),...rec].slice(0,5));
const paths=v.split(',').map(s=>s.trim()).filter(Boolean);
document.getElementById('scanbtn').disabled=true;
try{await api('POST','/api/scan',{paths});}catch(e){toast('scan failed: backend unreachable');document.getElementById('scanbtn').disabled=false;return;}
loadQuick();pollProg();}
async function stopScan(){try{await api('POST','/api/scan/stop');}catch(e){}toast('stopping scan…');}
async function pollProg(){let p;try{p=await api('GET','/api/scan/progress');}catch(e){return;}
document.getElementById('prog').textContent=p.running?`scanning ${p.phase} · ${p.seen} files`:(p.done?(p.error?'scan error':'scan done · '+p.seen+' files'):'');
document.getElementById('cancel').style.display=p.running?'':'none';
const vb=document.getElementById('vaultbadge');
if(p.running){vb.textContent='◌ scanning…';vb.className='badge warn';}
if(!p.running){document.getElementById('scanbtn').disabled=false;
if(state.tab==='storage')vStorage();else if(state.tab==='dashboard')vDashboard();}
if(p.running)setTimeout(pollProg,1500);}

let _did=0;
function donut(segs){const total=Math.max(1,segs.reduce((a,s)=>a+s[1],0));
const R=70,C=2*Math.PI*R,GAP=segs.length>1?4:0;let off=0;const id=++_did;
const arcs=segs.map(([l,v],i)=>{if(v<=0)return '';const frac=v/total;let len=frac*C-GAP;if(len<1)len=1;
const s=`<circle class="seg" data-i="${i}" cx="90" cy="90" r="${R}" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="24" stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 90 90)" onmouseenter="dH(${id},${i})" onmouseleave="dR(${id})"><title>${esc(l)} — ${fmt(v)}</title></circle>`;off+=frac*C;return s;}).join('');
window['_donut'+id]={segs:segs.map(([l,v])=>[l,v]),total};
return `<div class="donut-wrap"><svg class="donut" viewBox="0 0 180 180" style="width:200px;display:block;margin:6px auto">${arcs}
<text id="dc-${id}" x="90" y="86" text-anchor="middle" fill="#fff" font-size="20" font-weight="700" font-family="Space Grotesk">${fmt(total)}</text>
<text id="ds-${id}" x="90" y="106" text-anchor="middle" fill="rgba(255,255,255,.45)" font-size="11">total</text></svg>
<div class="legend">${segs.map(([l,v],i)=>`<span class="lpill" onmouseenter="dH(${id},${i})" onmouseleave="dR(${id})"><i style="background:${PAL[i%PAL.length]}"></i>${esc(l)} · ${fmt(v)} · ${Math.round(100*v/total)}%</span>`).join('')}</div></div>`;}
function dH(id,i){const d=window['_donut'+id];if(!d||!d.segs[i])return;const s=d.segs[i];
const a=document.getElementById('dc-'+id),b=document.getElementById('ds-'+id);
if(a)a.textContent=fmt(s[1]);if(b)b.textContent=s[0];
document.querySelectorAll('#main svg.donut circle.seg').forEach(c=>{c.style.opacity=(+c.dataset.i===i)?'1':'.3';});}
function dR(id){const d=window['_donut'+id];if(!d)return;
const a=document.getElementById('dc-'+id),b=document.getElementById('ds-'+id);
if(a)a.textContent=fmt(d.total);if(b)b.textContent='total';

function bars(rows,mx){return rows.map((r,i)=>`<div class="brow"><div class="row" style="justify-content:space-between;gap:10px"><span class="row" style="gap:8px;min-width:0;flex:1"><span class="rank">${i+1}</span><span class="truncate">📁 ${esc(r.name)}</span></span><span class="dim small" style="white-space:nowrap">${r.sub||''}</span></div><div class="bar"><i data-w="${Math.max(2,Math.round(100*r.value/mx))}"></i></div></div>`).join('');}

async function goTree(p){if(!p)return;state.treePath=p;document.getElementById('pathbar').value=p;crumbs(p);

const JUNK_RE=/(\.(tmp|temp|log|bak|old|cache|orig|rej|swp)$|^thumbs\.db$|^desktop\.ini$|^~)/i;
const JUNK_DIRS=new Set(['node_modules','__pycache__','.git','.venv','venv','.cache','$recycle.bin','system volume information']);
function catOf(x){const e=(x.name.split('.').pop()||'').toLowerCase();
if(x.is_dir)return 'Folders';
if(['jpg','jpeg','png','gif','webp','heic','bmp','svg'].includes(e))return 'Images';
if(['mp4','mkv','mov','avi','webm'].includes(e))return 'Videos';
if(['mp3','wav','flac','ogg','m4a'].includes(e))return 'Audio';
if(['pdf','doc','docx','txt','md','ppt','pptx','xls','xlsx','csv'].includes(e))return 'Documents';
if(['zip','rar','tar','gz','7z'].includes(e))return 'Archives';
if(['js','jsx','ts','py','java','c','cpp','html','css','json'].includes(e))return 'Code';
if(['exe','msi','dmg','apk'].includes(e))return 'Apps';
return 'Other';}
function cleanHide(x){if(!state.clean)return false;
if(x.is_dir)return JUNK_DIRS.has(x.name.toLowerCase());
return JUNK_RE.test(x.name);}
function fileRow(x){
const act=x.is_dir?`<a href="#" onclick="goTree('${qesc(x.path)}');return false">open</a>`:`<a href="#" onclick="op('${qesc(x.path)}');return false">open</a> · <a href="#" onclick="rev('${qesc(x.path)}');return false">reveal</a>`;
return `<div class="frow ${x.is_dir?'xrow':''}" ${x.is_dir?`ondblclick="goTree('${qesc(x.path)}')" title="double-click to open"`:''}>
<span class="n">${x.is_dir?'📁':'📄'} ${esc(x.name)}${x.hidden?' <span class="dim">·h</span>':''}</span>
${x.is_dir?'':`<span class="tier ${x.tier}">${x.tier}</span>`}
<span class="s">${x.is_dir?'':fmt(x.size)+' · '}${dt(x.mtime)}</span>
<span class="small">${act}</span></div>`;}
async function lsCur(){const p=state.treePath;const box=document.getElementById('ls');if(!p||!box)return;state.lsPath=p;
box.innerHTML='<div class="frow skel" style="height:44px"></div><div class="frow skel" style="height:44px"></div><div class="frow skel" style="height:44px"></div>';
const r=await api('GET','/api/ls?path='+encodeURIComponent(p)+'&power='+state.power);
if(r.error){box.innerHTML='<span class="dim">'+esc(r.error)+'</span>';return;}
const total=r.items.length;
const items=r.items.filter(x=>!cleanHide(x));
const hidden=total-items.length;
const key=state.sort||'name';
const cmp=key==='size'?(a,b)=>b.size-a.size:key==='modified'?(a,b)=>b.mtime-a.mtime:(a,b)=>a.name.toLowerCase()<b.name.toLowerCase()?-1:1;
const dirs=items.filter(x=>x.is_dir).sort(cmp);
const files=items.filter(x=>!x.is_dir);
let h='';
if(dirs.length)h+=`<div class="ghead">Folders · ${dirs.length}</div>`+dirs.map(fileRow).join('');
for(const g of ['Documents','Images','Videos','Audio','Archives','Code','Apps','Other']){
const grp=files.filter(f=>catOf(f)===g).sort(cmp);
if(grp.length)h+=`<div class="ghead">${g} · ${grp.length}</div>`+grp.map(fileRow).join('');}
if(!h)h='<div class="glass" style="margin-top:8px">Empty folder.</div>';
document.getElementById('lscount').textContent=`${items.length} shown${hidden?` · ${hidden} hidden by Clean view`:''}`;
box.innerHTML=h;}

/* ---------- ORGANIZE ---------- */
function vOrganize(){document.getElementById('main').innerHTML=`<div class="glass"><b>AI organization assistant</b>
<span class="dim small"> dry-run only · never auto-applies · Sensitive files withheld from cloud, filed locally</span>
<div class="row" style="margin-top:8px"><input id="obase" size="44" placeholder="Folder to organize, e.g. Downloads path">
<label class="small dim"><input type="checkbox" id="orec"> recursive</label>
<button class="btn-pri" id="planbtn" onclick="mkPlan()">Build plan</button></div><div id="oinfo" class="small dim" style="margin-top:6px"></div></div><div id="oplan"></div>`;
const last=lsGet('aegis-base','');if(last)document.getElementById('obase').value=last;}
async function mkPlan(){const base=document.getElementById('obase').value;lsSet('aegis-base',base);
document.getElementById('planbtn').disabled=true;
try{const r=await api('POST','/api/organize/plan',{base:base,recursive:document.getElementById('orec').checked});
if(!r.ok){document.getElementById('oinfo').textContent='error: '+r.error;return;}
state.plan=r;state.sel=new Set(r.moves.map(m=>m.id));
document.getElementById('oinfo').innerHTML=`source: <b>${r.source}</b> · cloud egress: ${r.ledger.egress?'yes':'NO — local only'} · entities: ${esc(JSON.stringify((r.ledger.entities||{}).counts||{}))} · residual masked: ${r.ledger.residual} · withheld sensitive: ${r.withheld.length} — see Privacy Ledger`;
document.getElementById('oplan').innerHTML=`<div class="glass"><div class="row"><b>Dry run — ${r.moves.length} moves</b>
<button class="btn-pri" onclick="applyPlan()">Apply selected</button><button class="btn-ghost" onclick="undoPlan()">Undo batch</button>
<button class="btn-ghost" onclick="selAll(true)">all</button><button class="btn-ghost" onclick="selAll(false)">none</button></div>
<table><tr><th></th><th>Old name</th><th>→ Folder / new name</th><th>Reason</th><th>Tier</th></tr>
${r.moves.map(m=>`<tr><td><input type="checkbox" checked onchange="tglSel('${m.id}',this.checked)"></td>
<td>${esc(m.old.split(/[/\\\\]/).pop())}</td><td><b>${esc(m.folder)}</b>/${esc(m.new_name)}</td>
<td class="small">${esc(m.reason)}</td><td><span class="tier ${m.tier}">${m.tier}</span></td></tr>`).join('')}</table></div>
${r.withheld.length?`<div class="glass"><b>Withheld from cloud (${r.withheld.length})</b><div class="small dim">${r.withheld.slice(0,20).map(esc).join('<br>')}</div></div>`:''}`;}
finally{document.getElementById('planbtn').disabled=false;}}
function selAll(on){if(!state.plan)return;state.sel=new Set(on?state.plan.moves.map(m=>m.id):[]);
document.querySelectorAll('#oplan input[type=checkbox]').forEach(x=>x.checked=on);}
function tglSel(id,on){on?state.sel.add(id):state.sel.delete(id);}
async function applyPlan(){const r=await api('POST','/api/organize/apply',{batch:state.plan.batch,selected:[...state.sel]});
toast('applied '+r.applied.filter(x=>x.ok).length+'/'+r.applied.length+' — batch '+r.batch);}
async function undoPlan(){if(!state.plan)return;const r=await api('POST','/api/organize/undo',{batch:state.plan.batch});
toast('undone '+r.undone.filter(x=>x.ok).length+'/'+r.undone.length);}

/* ---------- LEDGER (showpiece) ---------- */
function chipSent(s){return esc(s).replace(/\[([A-Z_]+)_\d+\]/g,'<span class="tok">[$1_■]</span>').replace(/\[MASKED(_[A-Z]+)?\]/g,'<span class="tok">[MASKED]</span>');}
function hiOrig(orig,spans){let h='',last=0;for(const s of (spans||[]).slice(0,80)){h+=esc(orig.slice(last,s.start))+'<mark class="pii" title="'+esc(s.type)+'">'+esc(orig.slice(s.start,s.end))+'</mark>';last=s.end;}return h+esc(orig.slice(last));}
async function vLedger(){const L=await api('GET','/api/ledger?limit=50');const s=L.stats;
document.getElementById('main').innerHTML=`
<div class="stats"><div class="stat"><b>${s.cloud_requests}</b><span>CLOUD REQUESTS</span></div>
<div class="stat"><b>${(s.bytes_sent/1024).toFixed(1)} KB</b><span>BYTES SENT</span></div>
<div class="stat"><b>${s.entities_redacted}</b><span>ENTITIES REDACTED</span></div>
<div class="stat"><b>${s.withheld}</b><span>SENSITIVE WITHHELD</span></div></div>
<div class="glass"><b>Redaction tester</b> <span class="dim small">paste text → redacted + counts + rehydrate roundtrip</span>
<div class="row" style="margin-top:6px"><input id="rt" size="56" placeholder="My PAN is ABCDE1234F, call 98765 43210"><button class="btn-pri" onclick="rTest()">Redact</button></div><div id="rtout"></div></div>
${L.rows.map(r=>{let ent={};try{ent=JSON.parse(r.entities||'{}')}catch(e){}
return `<div class="glass"><div class="row"><b>#${r.id} ${esc(r.purpose)}</b>
<span class="badge">${esc(r.provider)}${r.model?' · '+esc(r.model):''}</span>
<span class="badge ${r.egress?'warn':'ok'}">${r.egress?'☁ egress '+r.bytes_sent+' B':'✓ nothing left this device'}</span>
<span class="dim small">${new Date(r.ts*1000).toLocaleString()} · files sent ${r.files_sent} · withheld ${r.files_withheld} · residual ${r.residual} · ${r.ok?'ok':'ERROR'}</span></div>
${r.error?`<div class="small" style="color:var(--red)">${esc(r.error)}</div>`:''}
<div class="grid2" style="margin-top:8px"><div><div class="small dim">Original (PII highlighted)</div><pre>${hiOrig(r.original,ent.spans)}</pre></div>
<div><div class="small dim">Actually sent (tokens = dark chips)</div><pre>${r.sent?chipSent(r.sent):'<span class="dim">— nothing sent —</span>'}</pre></div></div>
<div class="small dim">entities: ${esc(JSON.stringify(ent.counts||{}))}</div></div>`}).join('')||'<div class="glass">No gateway calls yet. Run an organize plan, AI insights, or the tester.</div>'}`;}
async function rTest(){const r=await api('POST','/api/redact-test',{text:document.getElementById('rt').value});
document.getElementById('rtout').innerHTML=`<div class="grid2" style="margin-top:8px"><div><div class="small dim">Redacted (+guard)</div><pre>${chipSent(r.guarded)}</pre></div>
<div><div class="small dim">Counts: ${esc(JSON.stringify(r.counts))} · residual: ${r.residual} · roundtrip ${r.roundtrip_ok?'✓':'✗'}</div><pre>${esc(r.rehydrated.slice(0,300))}</pre></div></div>`;}

/* ---------- agent widget ---------- */
const AWSUG=["What can I delete?","Show duplicates","Is my data private?","Find my resume"];
function awToggle(){const p=document.getElementById('awpanel');p.classList.toggle('open');
if(p.classList.contains('open')){setTimeout(()=>document.getElementById('awin').focus(),120);
if(!document.getElementById('awlog').children.length){
awSay('a',"Hey! I'm the vault agent — I read your local index. Ask me to find files, free space, or prove your data stays private.");
document.getElementById('awchips').innerHTML=AWSUG.map(s=>`<button onclick="awAsk('${qesc(s)}')">${esc(s)}</button>`).join('');}}}
function awSay(who,text){const l=document.getElementById('awlog');const d=document.createElement('div');d.className='msg '+who;d.textContent=text;
d.title=new Date().toLocaleTimeString();l.appendChild(d);l.scrollTop=l.scrollHeight;return d;}
function awThinking(){const l=document.getElementById('awlog');const d=document.createElement('div');d.className='msg a tdots';
d.innerHTML='<span></span><span></span><span></span>';l.appendChild(d);l.scrollTop=l.scrollHeight;return d;}
function awAsk(s){const p=document.getElementById('awpanel');if(!p.classList.contains('open'))awToggle();
document.getElementById('awin').value=s;awSubmit(null,true);}
async function awSubmit(e,sent){if(e)e.preventDefault();
const inp=document.getElementById('awin');const t=inp.value.trim();if(!t)return;inp.value='';
awSay('u',t);const tp=awThinking();
try{const r=await api('POST','/api/agent',{text:t});
tp.remove();awSay('a',r.reply||'(no answer)');
if(r.tab)tab(r.tab,null);}catch(err){tp.remove();awSay('a','Backend unreachable — is the server running?');}}

/* ---------- settings ---------- */
async function openSettings(){try{const s=await api('GET','/api/settings');
const saved=lsGet('aegis-prefs',null);
document.getElementById('s_provider').value=(saved&&saved.provider)||s.provider;
document.getElementById('s_model').value=(saved&&saved.model)||s.model||'';
document.getElementById('s_base').value=(saved&&saved.base_url)||s.base_url||'';
document.getElementById('s_ollama').value=(saved&&saved.ollama_url)||s.ollama_url||'';
document.getElementById('s_omodel').value=(saved&&saved.ollama_model)||s.ollama_model||'';
document.getElementById('s_status').textContent='offline mode: '+(s.offline?'ON':'off');}catch(e){}
document.getElementById('settings').style.display='flex';}
function closeSettings(){document.getElementById('settings').style.display='none';}
async function saveSettings(){const b={provider:document.getElementById('s_provider').value,model:document.getElementById('s_model').value,
base_url:document.getElementById('s_base').value,ollama_url:document.getElementById('s_ollama').value,ollama_model:document.getElementById('s_omodel').value};
lsSet('aegis-prefs',{provider:b.provider,model:b.model,base_url:b.base_url,ollama_url:b.ollama_url,ollama_model:b.ollama_model});
const k=document.getElementById('s_key').value;if(k)b.api_key=k;
try{await api('POST','/api/settings',b);}catch(e){}
document.getElementById('s_key').value='';
document.getElementById('s_status').textContent='saved (key in RAM only, prefs local)';}
async function clearKey(){try{await api('POST','/api/settings',{clear_key:true});}catch(e){}
document.getElementById('s_status').textContent='key forgotten';}
async function setOffline(on){try{await api('POST','/api/offline',{on});toast(on?'offline — zero egress':'online');}catch(e){}}
async function boot(){try{await loadQuick();await vDashboard();}catch(e){dead(e.message||'fetch failed');}}
boot();
</script>
